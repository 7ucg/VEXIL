[package]
name = "vexil-obf-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Core library for the vexil-obf JS/Dart obfuscator"

[dependencies]
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = { version = "0.8", default-features = false, features = ["std_rng", "getrandom"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = { version = "0.22", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
