<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d1b5e"/>
      <stop offset="100%" stop-color="#1f1040"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3a2a"/>
      <stop offset="100%" stop-color="#0a2a1f"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a1a00"/>
      <stop offset="100%" stop-color="#2a1200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="url(#bg)" rx="12"/>
  <rect x="1" y="1" width="958" height="558" fill="none" stroke="#ffffff10" stroke-width="1" rx="12"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="960" height="3" fill="url(#accent)" rx="2"/>

  <!-- Title -->
  <text x="480" y="48" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="2">VEXIL — Tech Stack</text>
  <text x="480" y="70" text-anchor="middle" fill="#6b7280" font-size="13">Architecture overview</text>

  <!-- Layer labels (left) -->
  <text x="36" y="130" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">CONSUMERS</text>
  <text x="36" y="230" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">BINDINGS</text>
  <text x="36" y="330" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">CORE</text>
  <text x="36" y="420" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">PRIMITIVES</text>
  <text x="36" y="510" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">TOOLCHAIN</text>

  <!-- Layer 1: Consumer APIs -->
  <rect x="120" y="94" width="810" height="72" fill="url(#layer1)" rx="8" stroke="#00c6ff22" stroke-width="1"/>
  <!-- boxes -->
  <rect x="136" y="106" width="130" height="46" fill="#00c6ff18" rx="6" stroke="#00c6ff44" stroke-width="1"/>
  <text x="201" y="127" text-anchor="middle" fill="#00c6ff" font-size="13" font-weight="600">CLI</text>
  <text x="201" y="143" text-anchor="middle" fill="#7aa3c8" font-size="11">`vexil` binary</text>

  <rect x="280" y="106" width="130" height="46" fill="#00c6ff18" rx="6" stroke="#00c6ff44" stroke-width="1"/>
  <text x="345" y="127" text-anchor="middle" fill="#00c6ff" font-size="13" font-weight="600">C / FFI</text>
  <text x="345" y="143" text-anchor="middle" fill="#7aa3c8" font-size="11">cdylib + vexil.h</text>

  <rect x="424" y="106" width="130" height="46" fill="#00c6ff18" rx="6" stroke="#00c6ff44" stroke-width="1"/>
  <text x="489" y="127" text-anchor="middle" fill="#00c6ff" font-size="13" font-weight="600">Dart / Flutter</text>
  <text x="489" y="143" text-anchor="middle" fill="#7aa3c8" font-size="11">FFI binding</text>

  <rect x="568" y="106" width="130" height="46" fill="#00c6ff18" rx="6" stroke="#00c6ff44" stroke-width="1"/>
  <text x="633" y="127" text-anchor="middle" fill="#00c6ff" font-size="13" font-weight="600">Node.js / Browser</text>
  <text x="633" y="143" text-anchor="middle" fill="#7aa3c8" font-size="11">vexil-wasm</text>

  <rect x="712" y="106" width="204" height="46" fill="#00c6ff18" rx="6" stroke="#00c6ff44" stroke-width="1"/>
  <text x="814" y="127" text-anchor="middle" fill="#00c6ff" font-size="13" font-weight="600">Any Language</text>
  <text x="814" y="143" text-anchor="middle" fill="#7aa3c8" font-size="11">proto/vexil.proto (RPC)</text>

  <!-- Layer 2: Bindings -->
  <rect x="120" y="190" width="810" height="72" fill="url(#layer2)" rx="8" stroke="#7c3aed22" stroke-width="1"/>
  <rect x="136" y="202" width="250" height="46" fill="#7c3aed18" rx="6" stroke="#7c3aed44" stroke-width="1"/>
  <text x="261" y="223" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">vexil-ffi</text>
  <text x="261" y="239" text-anchor="middle" fill="#8b7eb8" font-size="11">Rust → C ABI (cdylib + staticlib)</text>

  <rect x="400" y="202" width="250" height="46" fill="#7c3aed18" rx="6" stroke="#7c3aed44" stroke-width="1"/>
  <text x="525" y="223" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">vexil-wasm</text>
  <text x="525" y="239" text-anchor="middle" fill="#8b7eb8" font-size="11">Rust → WASM (wasm-pack)</text>

  <rect x="664" y="202" width="252" height="46" fill="#7c3aed18" rx="6" stroke="#7c3aed44" stroke-width="1"/>
  <text x="790" y="223" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">vexil-obf (npm)</text>
  <text x="790" y="239" text-anchor="middle" fill="#8b7eb8" font-size="11">JS/Dart obfuscator + WASM VM</text>

  <!-- Layer 3: Core -->
  <rect x="120" y="286" width="810" height="72" fill="url(#layer3)" rx="8" stroke="#10b98122" stroke-width="1"/>
  <rect x="136" y="298" width="378" height="46" fill="#10b98118" rx="6" stroke="#10b98144" stroke-width="1"/>
  <text x="325" y="319" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">vexil-core</text>
  <text x="325" y="335" text-anchor="middle" fill="#6b9e89" font-size="11">password · sealed · signed · multi-recipient · streaming · PQ</text>

  <rect x="528" y="298" width="388" height="46" fill="#10b98118" rx="6" stroke="#10b98144" stroke-width="1"/>
  <text x="722" y="319" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">vexil-session</text>
  <text x="722" y="335" text-anchor="middle" fill="#6b9e89" font-size="11">PQXDH · Double Ratchet · group sender keys</text>

  <!-- Layer 4: Crypto Primitives -->
  <rect x="120" y="378" width="810" height="68" fill="url(#layer4)" rx="8" stroke="#f5922222" stroke-width="1"/>
  <g fill="#f59e0b" font-size="12" font-weight="600">
    <text x="160" y="407" fill="#fbbf24">AES-256-GCM</text>
    <text x="285" y="407" fill="#fbbf24">ChaCha20-Poly1305</text>
    <text x="440" y="407" fill="#fbbf24">X25519</text>
    <text x="513" y="407" fill="#fbbf24">Ed25519</text>
    <text x="600" y="407" fill="#fbbf24">ML-KEM-768/1024</text>
    <text x="762" y="407" fill="#fbbf24">ML-DSA-65</text>
    <text x="160" y="430" fill="#d97706" font-size="11" font-weight="400">Argon2id · HKDF · SHA-256 · BLAKE2b · zeroize</text>
  </g>

  <!-- Layer 5: Toolchain -->
  <rect x="120" y="468" width="810" height="64" fill="#0f0f1a" rx="8" stroke="#ffffff0d" stroke-width="1"/>
  <g fill="#6b7280" font-size="12">
    <text x="160" y="494" fill="#9ca3af">Rust (stable)</text>
    <text x="268" y="494" fill="#9ca3af">TypeScript</text>
    <text x="368" y="494" fill="#9ca3af">Babel</text>
    <text x="425" y="494" fill="#9ca3af">wasm-pack</text>
    <text x="530" y="494" fill="#9ca3af">Protobuf</text>
    <text x="621" y="494" fill="#9ca3af">Criterion</text>
    <text x="716" y="494" fill="#9ca3af">cargo-fuzz</text>
    <text x="806" y="494" fill="#9ca3af">GitHub Actions</text>
    <text x="160" y="515" fill="#6b7280" font-size="10">All crypto from reviewed crates — no primitives implemented in-house</text>
  </g>

  <!-- Connector lines -->
  <line x1="480" y1="166" x2="480" y2="190" stroke="#ffffff18" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="262" x2="480" y2="286" stroke="#ffffff18" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="358" x2="480" y2="378" stroke="#ffffff18" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="446" x2="480" y2="468" stroke="#ffffff18" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
