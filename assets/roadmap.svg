<svg width="960" height="580" viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="wip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="planned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1040"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
  </defs>

  <rect width="960" height="580" fill="url(#bg)" rx="12"/>
  <rect x="1" y="1" width="958" height="578" fill="none" stroke="#ffffff10" stroke-width="1" rx="12"/>
  <rect x="0" y="0" width="960" height="3" fill="url(#accent)" rx="2"/>

  <!-- Title -->
  <text x="480" y="46" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="2">VEXIL — Roadmap</text>
  <text x="480" y="68" text-anchor="middle" fill="#6b7280" font-size="13">Public beta · June 2026</text>

  <!-- Legend -->
  <rect x="660" y="82" width="14" height="14" fill="#34d399" rx="2"/>
  <text x="680" y="94" fill="#9ca3af" font-size="11">Done</text>
  <rect x="730" y="82" width="14" height="14" fill="#60a5fa" rx="2"/>
  <text x="750" y="94" fill="#9ca3af" font-size="11">In progress</text>
  <rect x="830" y="82" width="14" height="14" fill="#a78bfa" rx="2"/>
  <text x="850" y="94" fill="#9ca3af" font-size="11">Planned</text>

  <!-- Timeline spine -->
  <line x1="100" y1="128" x2="860" y2="128" stroke="#ffffff14" stroke-width="2"/>

  <!-- Phase markers on spine -->
  <circle cx="160" cy="128" r="6" fill="#34d399"/>
  <circle cx="360" cy="128" r="6" fill="#34d399"/>
  <circle cx="540" cy="128" r="6" fill="#60a5fa"/>
  <circle cx="710" cy="128" r="6" fill="#a78bfa"/>
  <circle cx="860" cy="128" r="6" fill="#a78bfa" fill-opacity="0.5"/>

  <!-- Phase labels -->
  <text x="160" y="118" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">v0.1</text>
  <text x="360" y="118" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">v0.2</text>
  <text x="540" y="118" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">v0.3</text>
  <text x="710" y="118" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">v0.4</text>
  <text x="860" y="118" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="600">v1.0</text>

  <text x="160" y="148" text-anchor="middle" fill="#6b7280" font-size="10">Foundation</text>
  <text x="360" y="148" text-anchor="middle" fill="#6b7280" font-size="10">Bindings</text>
  <text x="540" y="148" text-anchor="middle" fill="#6b7280" font-size="10">Sessions</text>
  <text x="710" y="148" text-anchor="middle" fill="#6b7280" font-size="10">Hardening</text>
  <text x="860" y="148" text-anchor="middle" fill="#6b7280" font-size="10">Stable</text>

  <!-- Cards row 1 -->
  <!-- v0.1 DONE card -->
  <rect x="32" y="170" width="208" height="160" fill="url(#done)" rx="8" stroke="#34d39944" stroke-width="1"/>
  <text x="136" y="194" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">v0.1 — Foundation</text>
  <text x="136" y="210" text-anchor="middle" fill="#6b7280" font-size="10">Done</text>
  <line x1="48" y1="218" x2="224" y2="218" stroke="#34d39920" stroke-width="1"/>
  <text x="52" y="238" fill="#a7f3d0" font-size="11">✓ vexil-core: 7 ops</text>
  <text x="52" y="256" fill="#a7f3d0" font-size="11">✓ AES-256-GCM + ChaCha20</text>
  <text x="52" y="274" fill="#a7f3d0" font-size="11">✓ Argon2id KDF</text>
  <text x="52" y="292" fill="#a7f3d0" font-size="11">✓ vexil-cli binary</text>
  <text x="52" y="310" fill="#a7f3d0" font-size="11">✓ cargo-fuzz harness</text>

  <!-- v0.2 DONE card -->
  <rect x="252" y="170" width="208" height="160" fill="url(#done)" rx="8" stroke="#34d39944" stroke-width="1"/>
  <text x="356" y="194" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">v0.2 — Bindings</text>
  <text x="356" y="210" text-anchor="middle" fill="#6b7280" font-size="10">Done</text>
  <line x1="268" y1="218" x2="444" y2="218" stroke="#34d39920" stroke-width="1"/>
  <text x="272" y="238" fill="#a7f3d0" font-size="11">✓ vexil-ffi (C ABI)</text>
  <text x="272" y="256" fill="#a7f3d0" font-size="11">✓ Dart / Flutter FFI</text>
  <text x="272" y="274" fill="#a7f3d0" font-size="11">✓ vexil-wasm (WASM)</text>
  <text x="272" y="292" fill="#a7f3d0" font-size="11">✓ vexil-obf 3-pass pipeline</text>
  <text x="272" y="310" fill="#a7f3d0" font-size="11">✓ Rollup / Vite / Webpack</text>

  <!-- v0.3 WIP card -->
  <rect x="472" y="170" width="208" height="160" fill="url(#wip)" rx="8" stroke="#60a5fa44" stroke-width="1"/>
  <text x="576" y="194" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">v0.3 — Sessions</text>
  <text x="576" y="210" text-anchor="middle" fill="#60a5fa" font-size="10">In progress</text>
  <line x1="488" y1="218" x2="664" y2="218" stroke="#60a5fa20" stroke-width="1"/>
  <text x="492" y="238" fill="#93c5fd" font-size="11">✓ PQXDH handshake</text>
  <text x="492" y="256" fill="#93c5fd" font-size="11">✓ Double Ratchet</text>
  <text x="492" y="274" fill="#93c5fd" font-size="11">✓ Group sender keys</text>
  <text x="492" y="292" fill="#bfdbfe" font-size="11">◌ ML-KEM-768 integration</text>
  <text x="492" y="310" fill="#bfdbfe" font-size="11">◌ vexil-session audit</text>

  <!-- v0.4 PLANNED card -->
  <rect x="692" y="170" width="208" height="160" fill="url(#planned)" rx="8" stroke="#a78bfa44" stroke-width="1"/>
  <text x="796" y="194" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">v0.4 — Hardening</text>
  <text x="796" y="210" text-anchor="middle" fill="#6b7280" font-size="10">Planned</text>
  <line x1="708" y1="218" x2="884" y2="218" stroke="#a78bfa20" stroke-width="1"/>
  <text x="712" y="238" fill="#c4b5fd" font-size="11">◌ Third-party audit</text>
  <text x="712" y="256" fill="#c4b5fd" font-size="11">◌ Sealed sender open</text>
  <text x="712" y="274" fill="#c4b5fd" font-size="11">◌ Streaming encryption</text>
  <text x="712" y="292" fill="#c4b5fd" font-size="11">◌ Performance tuning</text>
  <text x="712" y="310" fill="#c4b5fd" font-size="11">◌ Extended fuzzing</text>

  <!-- Row 2 -->
  <!-- v0.3 obf card -->
  <rect x="252" y="348" width="208" height="100" fill="url(#wip)" rx="8" stroke="#60a5fa44" stroke-width="1"/>
  <text x="356" y="372" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">vexil-obf next</text>
  <line x1="268" y1="378" x2="444" y2="378" stroke="#60a5fa20" stroke-width="1"/>
  <text x="272" y="396" fill="#bfdbfe" font-size="11">◌ Dart WASM runtime</text>
  <text x="272" y="414" fill="#bfdbfe" font-size="11">◌ Source map stripping</text>
  <text x="272" y="430" fill="#bfdbfe" font-size="11">◌ esbuild plugin</text>

  <!-- v1.0 stable card -->
  <rect x="472" y="348" width="428" height="100" fill="#0d0a1f" rx="8" stroke="#6b728040" stroke-width="1"/>
  <text x="686" y="372" text-anchor="middle" fill="#9ca3af" font-size="12" font-weight="600">v1.0 — Stable release</text>
  <line x1="488" y1="378" x2="884" y2="378" stroke="#6b728020" stroke-width="1"/>
  <text x="492" y="396" fill="#6b7280" font-size="11">◌ API stability guarantee</text>
  <text x="492" y="414" fill="#6b7280" font-size="11">◌ Production battle-testing</text>
  <text x="692" y="396" fill="#6b7280" font-size="11">◌ npm registry publish</text>
  <text x="692" y="414" fill="#6b7280" font-size="11">◌ crates.io publish</text>

  <!-- beta note -->
  <rect x="32" y="348" width="208" height="100" fill="#1a0a0a" rx="8" stroke="#ef444444" stroke-width="1"/>
  <text x="136" y="374" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">Beta notice</text>
  <line x1="48" y1="380" x2="224" y2="380" stroke="#ef444420" stroke-width="1"/>
  <text x="52" y="398" fill="#fca5a5" font-size="10.5">APIs may change without notice.</text>
  <text x="52" y="416" fill="#fca5a5" font-size="10.5">Not production-ready. No audit</text>
  <text x="52" y="434" fill="#fca5a5" font-size="10.5">has been completed yet.</text>

  <!-- connector lines from spine to cards -->
  <line x1="160" y1="134" x2="160" y2="170" stroke="#34d39930" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="134" x2="356" y2="170" stroke="#34d39930" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="134" x2="576" y2="170" stroke="#60a5fa30" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="710" y1="134" x2="796" y2="170" stroke="#a78bfa30" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Footer -->
  <text x="480" y="470" text-anchor="middle" fill="#374151" font-size="11">Dates are estimates. The project is open source; contributions welcome.</text>
  <text x="480" y="488" text-anchor="middle" fill="#374151" font-size="11">github.com/7ucg/VEXIL</text>
</svg>
