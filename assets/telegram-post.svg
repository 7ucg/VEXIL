<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#12083a"/>
    </linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff22"/>
      <stop offset="100%" stop-color="#7c3aed22"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- Subtle hex grid pattern -->
  <g stroke="#ffffff03" stroke-width="1" fill="none">
    <polygon points="600,60 660,94 660,162 600,196 540,162 540,94"/>
    <polygon points="600,196 660,230 660,298 600,332 540,298 540,230"/>
    <polygon points="480,130 540,164 540,232 480,266 420,232 420,164"/>
    <polygon points="720,130 780,164 780,232 720,266 660,232 660,164"/>
    <polygon points="480,266 540,300 540,368 480,402 420,368 420,300"/>
    <polygon points="720,266 780,300 780,368 720,402 660,368 660,300"/>
    <polygon points="360,60 420,94 420,162 360,196 300,162 300,94"/>
    <polygon points="840,60 900,94 900,162 840,196 780,162 780,94"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#grd)"/>

  <!-- Central logo area -->
  <text x="600" y="192" text-anchor="middle" fill="#ffffff" font-size="100" font-weight="900" letter-spacing="-4" opacity="0.97">VEXIL</text>

  <!-- Gradient underline -->
  <rect x="340" y="204" width="520" height="4" fill="url(#grd)" rx="2"/>

  <!-- Tagline -->
  <text x="600" y="248" text-anchor="middle" fill="#9ca3af" font-size="18" letter-spacing="6">ENCRYPTION  ·  OBFUSCATION  ·  OPEN SOURCE</text>

  <!-- Beta pill -->
  <rect x="536" y="268" width="128" height="30" fill="url(#pill)" rx="15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
  <text x="600" y="288" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700" letter-spacing="2">BETA — USE WITH CARE</text>

  <!-- Feature row -->
  <g transform="translate(0, 330)">
    <!-- Box 1 -->
    <rect x="80" y="0" width="224" height="110" fill="#0d0d1a" rx="10" stroke="#00c6ff22" stroke-width="1"/>
    <text x="192" y="30" text-anchor="middle" fill="#00c6ff" font-size="28">🔐</text>
    <text x="192" y="58" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">Post-Quantum</text>
    <text x="192" y="76" text-anchor="middle" fill="#6b7280" font-size="11.5">ML-KEM-768/1024</text>
    <text x="192" y="93" text-anchor="middle" fill="#6b7280" font-size="11.5">ML-DSA-65 signatures</text>

    <!-- Box 2 -->
    <rect x="324" y="0" width="224" height="110" fill="#0d0d1a" rx="10" stroke="#a78bfa22" stroke-width="1"/>
    <text x="436" y="30" text-anchor="middle" fill="#a78bfa" font-size="28">⚡</text>
    <text x="436" y="58" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">JS Obfuscator</text>
    <text x="436" y="76" text-anchor="middle" fill="#6b7280" font-size="11.5">AES-256-GCM WASM VM</text>
    <text x="436" y="93" text-anchor="middle" fill="#6b7280" font-size="11.5">3-pass pipeline</text>

    <!-- Box 3 -->
    <rect x="568" y="0" width="224" height="110" fill="#0d0d1a" rx="10" stroke="#34d39922" stroke-width="1"/>
    <text x="680" y="30" text-anchor="middle" fill="#34d399" font-size="28">🔄</text>
    <text x="680" y="58" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">Signal Protocol</text>
    <text x="680" y="76" text-anchor="middle" fill="#6b7280" font-size="11.5">PQXDH + Double Ratchet</text>
    <text x="680" y="93" text-anchor="middle" fill="#6b7280" font-size="11.5">Group sender keys</text>

    <!-- Box 4 -->
    <rect x="812" y="0" width="224" height="110" fill="#0d0d1a" rx="10" stroke="#fbbf2422" stroke-width="1"/>
    <text x="924" y="30" text-anchor="middle" fill="#fbbf24" font-size="28">🌐</text>
    <text x="924" y="58" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">Multi-Platform</text>
    <text x="924" y="76" text-anchor="middle" fill="#6b7280" font-size="11.5">Rust · Dart · Node · C</text>
    <text x="924" y="93" text-anchor="middle" fill="#6b7280" font-size="11.5">WASM browser support</text>
  </g>

  <!-- Bottom section -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#ffffff0a" stroke-width="1"/>
  <text x="600" y="562" text-anchor="middle" fill="#4b5563" font-size="13" letter-spacing="1">Open source · Rust · MIT License</text>
  <text x="600" y="588" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">github.com/7ucg/VEXIL</text>
  <text x="600" y="612" text-anchor="middle" fill="#1f2937" font-size="11">APIs not yet stable — do not use in production systems handling real user data</text>

  <!-- Bottom bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#grd)"/>
</svg>
