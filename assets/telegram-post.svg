<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07071a"/>
      <stop offset="50%" stop-color="#0d0b22"/>
      <stop offset="100%" stop-color="#120830"/>
    </linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="grdV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <!-- card gradients -->
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c6ff14"/>
      <stop offset="100%" stop-color="#00c6ff06"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa14"/>
      <stop offset="100%" stop-color="#a78bfa06"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d39914"/>
      <stop offset="100%" stop-color="#34d39906"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf2414"/>
      <stop offset="100%" stop-color="#fbbf2406"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.025">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Corner accents -->
  <g stroke="url(#grd)" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="36,60 36,36 60,36"/>
    <polyline points="1140,36 1164,36 1164,60"/>
    <polyline points="36,570 36,594 60,594"/>
    <polyline points="1140,594 1164,594 1164,570"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#grd)"/>

  <!-- ─── WORDMARK ─── -->
  <text x="600" y="204" text-anchor="middle" fill="#ffffff" font-size="112" font-weight="900" letter-spacing="-3">VEXIL</text>

  <!-- Gradient underline -->
  <rect x="368" y="218" width="464" height="3.5" fill="url(#grd)" rx="2"/>

  <!-- Tagline -->
  <text x="600" y="258" text-anchor="middle" fill="#8b92a5" font-size="15" letter-spacing="5.5">ENCRYPTION  ·  OBFUSCATION  ·  OPEN SOURCE</text>

  <!-- Beta pill -->
  <rect x="518" y="278" width="164" height="28" fill="none" rx="14" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="519" y="279" width="162" height="26" fill="#ef444410" rx="13"/>
  <text x="600" y="297" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700" letter-spacing="2.5">BETA — USE WITH CARE</text>

  <!-- ─── FEATURE CARDS ─── -->
  <!-- Card 1: Post-Quantum -->
  <rect x="68" y="342" width="248" height="122" rx="12" fill="url(#c1)" stroke="#00c6ff" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Icon: shield/lock shape -->
  <g transform="translate(162, 365)">
    <path d="M0,-14 L12,-8 L12,2 Q12,12 0,18 Q-12,12 -12,2 L-12,-8 Z" fill="none" stroke="#00c6ff" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="0" y1="-2" x2="0" y2="6" stroke="#00c6ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-4" r="2.5" fill="#00c6ff"/>
  </g>
  <text x="192" y="407" text-anchor="middle" fill="#e5e7eb" font-size="14.5" font-weight="700">Post-Quantum</text>
  <text x="192" y="427" text-anchor="middle" fill="#6b7280" font-size="12">ML-KEM-768/1024</text>
  <text x="192" y="445" text-anchor="middle" fill="#6b7280" font-size="12">ML-DSA-65 signatures</text>
  <!-- top accent line -->
  <rect x="68" y="342" width="248" height="3" fill="#00c6ff" rx="2" opacity="0.7"/>

  <!-- Card 2: JS Obfuscator -->
  <rect x="336" y="342" width="248" height="122" rx="12" fill="url(#c2)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Icon: lightning bolt -->
  <g transform="translate(430, 368)">
    <path d="M6,-15 L-4,2 L3,2 L-6,18 L8,0 L1,0 Z" fill="#a78bfa" opacity="0.9"/>
  </g>
  <text x="460" y="407" text-anchor="middle" fill="#e5e7eb" font-size="14.5" font-weight="700">JS Obfuscator</text>
  <text x="460" y="427" text-anchor="middle" fill="#6b7280" font-size="12">AES-256-GCM WASM VM</text>
  <text x="460" y="445" text-anchor="middle" fill="#6b7280" font-size="12">3-pass pipeline</text>
  <rect x="336" y="342" width="248" height="3" fill="#a78bfa" rx="2" opacity="0.7"/>

  <!-- Card 3: Signal Protocol -->
  <rect x="604" y="342" width="248" height="122" rx="12" fill="url(#c3)" stroke="#34d399" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Icon: two interlocking circles (double ratchet) -->
  <g transform="translate(698, 368)">
    <circle cx="-7" cy="0" r="10" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="7" cy="0" r="10" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <!-- arrow -->
    <path d="M-3,-10 L3,-14 L3,-6 Z" fill="#34d399"/>
    <path d="M3,10 L-3,14 L-3,6 Z" fill="#34d399"/>
  </g>
  <text x="728" y="407" text-anchor="middle" fill="#e5e7eb" font-size="14.5" font-weight="700">Signal Protocol</text>
  <text x="728" y="427" text-anchor="middle" fill="#6b7280" font-size="12">PQXDH + Double Ratchet</text>
  <text x="728" y="445" text-anchor="middle" fill="#6b7280" font-size="12">Group sender keys</text>
  <rect x="604" y="342" width="248" height="3" fill="#34d399" rx="2" opacity="0.7"/>

  <!-- Card 4: Multi-Platform -->
  <rect x="872" y="342" width="248" height="122" rx="12" fill="url(#c4)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Icon: globe-like shape -->
  <g transform="translate(966, 368)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="12" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
    <line x1="-10" y1="6" x2="10" y2="6" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="996" y="407" text-anchor="middle" fill="#e5e7eb" font-size="14.5" font-weight="700">Multi-Platform</text>
  <text x="996" y="427" text-anchor="middle" fill="#6b7280" font-size="12">Rust · Dart · Node · C</text>
  <text x="996" y="445" text-anchor="middle" fill="#6b7280" font-size="12">WASM browser support</text>
  <rect x="872" y="342" width="248" height="3" fill="#fbbf24" rx="2" opacity="0.7"/>

  <!-- ─── BOTTOM ─── -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#ffffff" stroke-width="1" opacity="0.06"/>

  <text x="600" y="544" text-anchor="middle" fill="#4b5563" font-size="13">Open source · Rust · MIT License</text>
  <text x="600" y="572" text-anchor="middle" fill="#6b7280" font-size="15" font-weight="600" letter-spacing="0.5">github.com/7ucg/VEXIL</text>
  <text x="600" y="600" text-anchor="middle" fill="#374151" font-size="11">APIs not yet stable — do not use in production systems handling real user data</text>

  <!-- Bottom bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#grd)"/>
</svg>
